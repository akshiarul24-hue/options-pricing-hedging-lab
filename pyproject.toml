[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "optionslab"
version = "1.0.0"
description = "Option pricing (closed form, Monte Carlo, PDE, binomial), Greeks, implied volatility and delta-hedging simulation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7.0", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
